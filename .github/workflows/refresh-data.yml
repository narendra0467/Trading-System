name: Refresh Market Data

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # Weekdays during market hours, roughly every 2 hours.
    # During daylight saving time: 08:30, 10:30, 12:30, 14:30 Edmonton time.
    - cron: "30 14-20/2 * * 1-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh high-risk scanner
        run: npm run highrisk:scan

      - name: Refresh stock swing scanner
        run: npm run scan

      - name: Refresh options scanner
        run: npm run options:scan

      - name: Refresh LEAPS scanner
        run: node src/leapsCli.js

      - name: Refresh public stock analyzer cache
        run: node src/analyzerCacheCli.js

      - name: Refresh swing backtest
        run: npm run backtest

      - name: Export static dashboard
        run: npm run export:static

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports public/dashboard.json public/analyzer-cache.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh market data"
            git push
          fi
