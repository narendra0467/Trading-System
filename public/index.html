<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senior Stock Analyzer</title>
    <link rel="stylesheet" href="./styles.css?v=20260520-clean" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">5-Year Fundamentals + Technical Entry Plan + Valuation Risk + Earnings Thesis + Shares vs LEAPS Decision</p>
          <h1>Senior Stock Analyzer</h1>
        </div>
      </header>

      <section class="tab-panel tab-panel--active" id="tab-analyzer">
        <section class="coach">
          <form class="analyzer-form" id="analyzer-form">
            <div class="analyzer-search">
              <input id="analyzer-symbol" name="symbol" placeholder="Search company or ticker, e.g. app, Tesla, NVDA, SHOP.TO" autocomplete="off" />
              <div class="analyzer-suggestions" id="analyzer-suggestions"></div>
            </div>
            <button type="submit">Analyze</button>
          </form>
          <p class="analyzer-note">Works live on the local dashboard server. U.S. tickers use regular symbols; Canadian tickers usually need suffixes like .TO, .V, .NE, or .CN.</p>
          <div id="analyzer-result"></div>
        </section>
      </section>

    </main>
    <script src="./app.js?v=20260520-clean"></script>
  </body>
</html>
