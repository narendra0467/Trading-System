<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Intraday Desk</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Private Local System</p>
          <h1>Intraday Trading Desk</h1>
          <p id="updated" class="muted">Not scanned yet</p>
        </div>
        <div class="actions">
          <button id="scan">Run Scan</button>
          <button id="load">Load Latest</button>
        </div>
      </header>

      <section id="trade-policy" class="policy"></section>

      <section id="summary" class="summary"></section>

      <section>
        <div class="section-title">
          <div>
            <p class="eyebrow">Decision Board</p>
            <h2>Today's Signals</h2>
          </div>
        </div>
        <div id="signal-board" class="signal-board"></div>
      </section>

      <section class="secondary-panel">
        <div class="section-title">
          <div>
            <p class="eyebrow">Market Context</p>
            <h2>Why The Desk Is Saying This</h2>
          </div>
          <span id="status" class="status">Ready</span>
        </div>
        <div id="desk-context" class="context-grid"></div>
      </section>

      <section class="secondary-panel">
        <div class="section-title">
          <div>
            <p class="eyebrow">Paper Tracking</p>
            <h2>Signal Results</h2>
          </div>
        </div>
        <div id="paper-results" class="paper-grid"></div>
      </section>

      <details class="debug-panel">
        <summary>Technical Debug Table</summary>
        <div id="table" class="table-wrap"></div>
      </details>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
